    <div id="root"></div>
    <script type="application/ld+json" id="loomiq-app-schema">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "LoomIQ",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "LoomIQ is a flexible ERP platform for orders, inventory, production, finance, and operations across growing businesses.",

          "@type": "Organization",
          "name": "LoomIQ"
        }
      }
    </script>
    <script type="application/ld+json" id="loomiq-faq-schema">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is LoomIQ built for cloth manufacturers?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. LoomIQ is designed for fabric mills, dyeing and processing units, garment manufacturers, home-textile businesses, and textile traders that need commercial, factory, stores, and finance data connected."
            }
          },
          {
            "@type": "Question",
            "name": "Can it handle raw material and finished goods inventory?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. You can manage yarn, fabric, trims, dyes, chemicals, packaging, work in progress, rolls, batches, and finished goods across stores and locations."
            }
          },
          {
            "@type": "Question",
            "name": "Can we track production and quality stages?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The workflow can cover material issue, production stages, dyeing or finishing, inspection, rejection, rework, approval, and dispatch. The exact setup depends on your process."
            }
          }
        ]
      }
    </script>
